name: Update icon sets

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every provider even if its icon set is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install font dependencies
        run: npm ci

      - name: Install system dependencies (Inkscape, ImageMagick, HarfBuzz)
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick build-essential pkg-config libssl-dev libharfbuzz-bin

      - name: Ensure ImageMagick CLI (magick)
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1; then
            if command -v convert >/dev/null 2>&1; then
              sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
            else
              echo "ImageMagick not found; install failed?" >&2
              exit 1
            fi
          fi
          magick -version || convert -version || true
          inkscape --version

      - name: Setup RoKit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Trust and install tools
        run: |
          rm -rf rokit.toml
          rokit init
          rokit trust lune-org/lune
          rokit add lune-org/lune@0.9.4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build tarmac from source
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/tarmac --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build icon registry
        env:
          ROBLOX_API_TOKEN: ${{ secrets.ROBLOX_API_TOKEN }}
          ROBLOX_CREATOR_ID: ${{ secrets.ROBLOX_CREATOR_ID }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          lune run scripts/build.luau ${{ inputs.force && '--force' || '' }}

      # Keep uploaded asset ids even when the build fails halfway, so a re-run does not upload them again
      - name: Save upload cache
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f site/providers/uploads.json ]; then
            git add site/providers/uploads.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(assets): cache uploaded spritesheet ids"
              git push
            fi
          fi

      - name: Verify fonts and loader
        run: npm test

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): update generated icon assets"
          fi
          git push
